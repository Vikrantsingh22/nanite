services:
  tools:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - api_node_modules:/app/apps/api/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      - SEPOLIA_RPC_URL=${SEPOLIA_RPC_URL:-https://ethereum-sepolia-rpc.publicnode.com}
      - DATABASE_URL=${DATABASE_URL:-postgres://nanite:nanite@db:5432/nanite}
    command: ["bash"]

  db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: nanite
      POSTGRES_PASSWORD: nanite
      POSTGRES_DB: nanite
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanite -d nanite"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - web_next:/app/apps/web/.next
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://nanite:nanite@db:5432/nanite}
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev"]

  api:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://nanite:nanite@db:5432/nanite}
      - WEB_ORIGIN=${WEB_ORIGIN:-http://localhost:3000}
      - PORT=4000
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
    # install only when the volumes are empty (web's start also installs; avoid racing it)
    command: ["sh", "-c", "[ -x node_modules/.bin/tsx ] || npm install --no-audit --no-fund; npm run db:migrate && npm run dev -w apps/api"]

  signer:
    image: node:22
    working_dir: /app/signer
    volumes:
      - ./signer:/app/signer:ro
    ports:
      - "127.0.0.1:5173:5173"
    command: ["npx", "--yes", "http-server@14.1.1", ".", "-p", "5173", "-a", "0.0.0.0", "-c-1", "--cors"]

  # Quick tunnel for real Resend webhooks (docs/resend-integration.md, section 4). Not started by default.
  # The random https://<x>.trycloudflare.com URL is printed in the log. It forwards ALL api routes: stop it after the test.
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.10.2
    command: ["tunnel", "--no-autoupdate", "--url", "http://api:4000"]
    depends_on:
      - api

  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /app/e2e
    ipc: host
    volumes:
      - .:/app
      - e2e_node_modules:/app/e2e/node_modules
    environment:
      - BASE_URL=http://web:3000
      - API_URL=${E2E_API_URL:-http://api:4000}
      - CI=1
    ports:
      - "127.0.0.1:9323:9323"
    depends_on:
      - web
      - api
    command: ["bash"]

  # Headed browser on a virtual display, viewable via noVNC. noVNC has NO password: it is bound to 127.0.0.1 only.
  browser:
    profiles: ["headed"]
    build:
      context: ./e2e
      dockerfile: headed.Dockerfile
    image: nanite-e2e-headed:1.64.1
    working_dir: /app/e2e
    ipc: host
    volumes:
      - .:/app
      - e2e_node_modules:/app/e2e/node_modules
    environment:
      - BASE_URL=http://web:3000
      - API_URL=${E2E_API_URL:-http://api:4000}
      - DISPLAY=:99
    ports:
      - "127.0.0.1:6080:6080"
    depends_on:
      - web
      - api
    command: ["bash", "/app/e2e/bin/headed-start.sh"]

volumes:
  e2e_node_modules:
  node_modules:
  web_node_modules:
  api_node_modules:
  web_next:
  pgdata:
