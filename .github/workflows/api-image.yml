name: API image

# Builds apps/api/Dockerfile and pushes it to GHCR. The server only pulls (docs/deployment.md).
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "config/**"
      - "contracts/abi/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - ".github/workflows/api-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: api-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image names must be lower-case; GitHub user names may not be.
      - name: Image owner (lower-case)
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/nanite-api:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.name }}/nanite-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
